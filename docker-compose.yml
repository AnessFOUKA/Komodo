services:
  vita:
    container_name: vita
    build: ./Dockerfiles/vita/
    working_dir: /KomodoV2/
    volumes:
      - ./include:/KomodoV2/include/
      - ./src:/KomodoV2/src/
      - ./Makefiles/vita/Makefile:/KomodoV2/Makefile
      - ./libs:/KomodoV2/libs
      - ./builds/vita:/KomodoV2/build
      - ./gameFiles:/KomodoV2/gameFiles
    command : > 
      bash -c "
        if [[ ! -d /KomodoV2/libs/vita ]]; then
          mkdir /KomodoV2/libs/vita
          cp -r $$VITASDK/arm-vita-eabi/include /KomodoV2/libs/vita
        fi
        make
      "
  3ds:
    container_name: 3ds
    image: devkitpro/devkitarm:20260610
    working_dir: /KomodoV2/
    environment:
      - test=gameFilesInternal/gfx gameFilesInternal/gfx2
    volumes:
      - ./include:/KomodoV2/include/
      - ./src:/KomodoV2/src/
      - ./Makefiles/3ds/Makefile:/KomodoV2/Makefile
      - ./libs/3ds:/KomodoV2/libs
      - ./builds/3ds:/KomodoV2/build
      - ./gameFiles:/KomodoV2/gameFiles
      - ./3dsTools:/KomodoV2/tools
    command: > 
      bash -c "
        if [[ ! -d /KomodoV2/libs/3ds ]]; then
          mkdir /KomodoV2/libs/3ds
          cp -rf $$DEVKITPRO/libctru/include/* /KomodoV2/libs
        fi

        if [[ ! -d "gameFilesInternal" ]]; then
          mkdir gameFilesInternal
        fi
      
        cp -r /KomodoV2/gameFiles/* /KomodoV2/gameFilesInternal 
       
        cd /KomodoV2/gameFilesInternal/gfx

        for file in *.png; do 
          echo '--atlas -f rgba8888 -z auto'>$$file.t3s 
          echo "$$file">>$$file.t3s; 
        done 
    
        cd /KomodoV2
        make 
        cp *.3dsx /KomodoV2/build 
      "